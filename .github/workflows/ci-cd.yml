name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # `/catalogue` interroge le catalogue au prerendu : sans schema, le build
      # s'arrete sur « no such table: main.Product ». Une base vide suffit.
      - run: npx prisma db push
      - run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # `audit.service.test.ts` s'execute contre une vraie base : sans schema,
      # ces tests echouaient sur « no such table: main.User ».
      - run: npx prisma db push
      - run: npx vitest run

  # Les tests E2E tournent aussi sur les pull requests : restreints a `main`,
  # ils ne signalaient une regression qu'une fois la fusion faite, et le job
  # `deploy` ne les attend pas.
  e2e:
    runs-on: ubuntu-latest
    needs: [build]
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # `--skip-generate` n'existe plus depuis Prisma 7 : la commande sortait en
      # erreur et le job echouait avant meme d'installer le navigateur.
      - run: npx prisma db push
      # Les flux critiques se connectent avec les comptes du seed : sans cette
      # etape, la base creee par `db push` est vide et tous ces tests echouent.
      # Les produits, eux, sont crees par les scenarios eux-memes.
      - run: npm run db:seed:accounts
      # `needs: [build]` ordonne les jobs mais ne partage pas le disque : sans
      # build ici, le serveur de test (`next start`) s'arrete sur
      # « Could not find a production build in the '.next' directory ».
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # Le deploiement en production attend les tests : il ne dependait que de
  # `build`, et partait donc meme si les tests unitaires ou les flux critiques
  # echouaient. `continue-on-error` est conserve pour que l'indisponibilite de
  # Vercel ne fasse pas echouer toute la chaine, mais il ne masque plus un
  # deploiement lance sur du code casse : les tests sont passes avant.
  deploy:
    runs-on: ubuntu-latest
    needs: [build, unit-tests, e2e]
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
